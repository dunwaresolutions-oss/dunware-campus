[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S107"]
"*/tests.py" = ["S105", "S106", "S107"]
"conftest.py" = ["S105", "S106", "S107"]
"config/settings/*" = ["F403", "F405", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    # whitenoise warns when STATIC_ROOT has no collectstatic output; irrelevant in tests
    "ignore:No directory at:UserWarning",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
